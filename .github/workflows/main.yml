name: Build for Fork (No Deploy)

on: workflow_dispatch

jobs:
  deploy:
    name: Build Flagrum
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract Flagrum Version
        id: setup
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Flagrum/Flagrum.csproj
          $baseVersion = $project.Project.PropertyGroup.BaseVersion
          $version = $project.Project.PropertyGroup.Version
          $resolved = $version -replace '\$\(.+?\)', $baseVersion
          "version=$resolved" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Flagrum Version: $resolved"

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x # Behält die im originalen Repo geforderte Version bei

      # Der Schritt mit dem "Premium DLL Package Source" wurde entfernt, da er Kizari-Passwörter verlangt.
      # Der Build wird hier ohne das Flag "-p:UsePremiumPackageSource=true" ausgeführt.
      - name: Publish Windows Build
        run: dotnet publish src/Flagrum/Flagrum.csproj -c Release -o publish-win-x64 -r win-x64 --self-contained true

      - name: Build Launcher
        run: dotnet publish src/Flagrum.Launcher/Flagrum.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishTrimmed=true -p:PublishSingleFile=true -o publish-launcher

      # Sammelt die gebauten Dateien in einen gemeinsamen Ordner zum Herunterladen
      - name: Prepare Artifact Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./Flagrum_Output
          Copy-Item -Path ./publish-win-x64/* -Destination ./Flagrum_Output/ -Recurse
          if (Test-Path ./publish-launcher/Flagrum.Launcher.exe) {
            Copy-Item -Path ./publish-launcher/Flagrum.Launcher.exe -Destination ./Flagrum_Output/
          }

      # Lädt das fertige Programm als ZIP-Datei unter den GitHub-Actions hoch
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flagrum-Windows-Fork-Build
          path: ./Flagrum_Output/
