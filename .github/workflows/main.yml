name: Build Setup EXE for Fork

on: workflow_dispatch

jobs:
  build-installer:
    name: Create Flagrum Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Flagrum Version
        id: setup
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Flagrum/Flagrum.csproj
          $baseVersion = $project.Project.PropertyGroup.BaseVersion
          $version = $project.Project.PropertyGroup.Version
          $resolved = $version -replace '\$\(.+?\)', $baseVersion
          "version=$resolved" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Flagrum Version: $resolved"

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Kompiliert das Hauptprojekt ohne die private Premium-Paketquelle
      - name: Publish Windows Build
        run: dotnet publish src/Flagrum/Flagrum.csproj -c Release -o publish-win-x64 -r win-x64 --self-contained true

      # Generiert die unskalierte/unsignierte Setup-EXE über Velopack (vpk)
      - name: Create Velopack Installer
        run: |
          dotnet tool install -g vpk
          vpk [win] pack -u Flagrum -v ${{ steps.setup.outputs.version }} -p publish-win-x64 -e Flagrum.exe -s .github/Images/Splash.png -i src/Flagrum/Resources/Flagrum.ico --packAuthors "Fork-Developer" --packTitle Flagrum --exclude .*\.zzzzz --framework webview2 --channel win --runtime win-x64
          if (Test-Path Releases/Flagrum-win-Setup.exe) {
            mv Releases/Flagrum-win-Setup.exe Releases/Flagrum-win-x64.exe
          }

      # Lädt den fertigen Installer sowie die Update-Pakete als GitHub-Artefakt hoch
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flagrum-Setup-EXE
          path: Releases/
